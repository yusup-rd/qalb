name: Deploy legal documents

on:
  push:
    branches: [main]
    paths:
      - "docs/legal/**"
      - "legal-site/**"
      - ".github/workflows/deploy-legal-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install site dependencies
        run: npm ci
        working-directory: legal-site
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build legal website
        run: node legal-site/build.mjs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: legal-site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
